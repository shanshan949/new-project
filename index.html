<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>示範診所</title>
  <!-- Bootstrap：別人寫好的一大包樣式，載入之後用 class 名稱套用 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- 自己的樣式放後面，才能蓋過 Bootstrap -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar navbar-expand navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">示範診所</a>
      <div class="navbar-nav">
        <a class="nav-link" href="#services">服務項目</a>
        <a class="nav-link" href="#news">最新消息</a>
        <a class="nav-link" href="#hours">門診時間</a>
        <a class="nav-link" href="#traffic">交通資訊</a>
        <a class="nav-link" href="#contact">聯絡我們</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row align-items-center">
      <div class="col-md-8">
        <h1 class="display-5">示範診所</h1>
        <p class="lead">家庭醫學科・一般內科。看診前請先預約。</p>
        <div id="today" class="alert alert-info">今天...</div>
        <button class="btn btn-sm btn-outline-secondary" id="bigButton">字體放大</button>

      </div>
      <div class="col-md-4 text-center">
        <img src="images/clinic.svg" alt="示範診所的外觀" class="img-fluid">
      </div>
    </div>

    <h2 id="services" class="section-title">服務項目</h2>
    <ul class="list-group list-group-flush">
      <li class="list-group-item">一般內科門診</li>
      <li class="list-group-item">慢性病追蹤（高血壓、糖尿病）</li>
      <li class="list-group-item">成人健康檢查</li>
      <li class="list-group-item">疫苗接種</li>
    </ul>

    <!-- 最新消息 -->
    <h2 id="news" class="section-title">最新消息</h2>

    <ul id="newsList" class="list-group list-group-flush">
      <li class="list-group-item">&#x20;</li>
    </ul>

<!-- 醫師介紹 -->
<h2 id="doctors" class="section-title">醫師介紹</h2>

<div class="row g-3" id="doctorCards">
</div>

<div class="mt-3">
  <button class="btn btn-outline-primary" id="reloadDoctors">
    重新載入
  </button>
</div>

    <h2 id="hours" class="section-title">門診時間</h2>
    <table class="table table-striped text-center">
      <thead class="table-light">
        <tr>
          <th>星期</th>
          <th>上午 09:00–12:00</th>
          <th>下午 14:00–17:00</th>
          <th>晚上 18:00–21:00</th>
        </tr>
      </thead>
      <tbody id="hoursBody"></tbody>

    </table>
    <div class="alert alert-warning">星期日與國定假日休診。</div>

    <h2 id="traffic" class="section-title">交通資訊</h2>


    <button class="btn btn-outline-primary" id="moreButton">看更多</button>
    <div id="moreInfo" class="d-none mt-3">
      <p>地址：臺北市中正區示範路 1 號 /捷運:中正紀念堂站2號出口 步行5分鐘</p>
      <a class="btn btn-outline-primary" href="https://www.google.com/maps" target="_blank">在地圖上看</a>
    </div>
    <h2 id="contact" class="section-title">聯絡我們</h2>
    <form class="row g-3" id="contactForm">
      <div class="col-md-6">
        <label class="form-label" for="name">姓名</label>
        <input class="form-control" id="name" name="name">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="phone">電話</label>
        <input class="form-control" id="phone" name="phone" type="tel">
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email（選填）</label>
        <input type="text" class="form-control" id="email" placeholder="請輸入 Email">
</div>

      <div class="col-md-6" >
        <label class="form-label" for="dept">想問哪一科</label>
        <select class="form-select" id="dept" name="dept">
          <option value="fm">家庭醫學科</option>
          <option value="im">一般內科</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label" for="message">想問的事</label>
        <textarea class="form-control" id="message" name="message" rows="4"></textarea>
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">送出</button>
        <span id="formMessage" class="ms-3"></span>
      </div>
    </form>
    <h2 id="fhir" class="section-title">延伸"問FHIR伺服器</h2>
    <button class="btn btn-outline-primary" id="fhirButton">按下 問FHIR伺服器</button>
    <span id ="fhirInfo" class="ms-3"></span>
  </div>
  <script src="JS/app.js"></script>
</body>

</html>
